<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicemod - Активация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 20%, #0a1628 0%, #03070f 100%);
            padding: 20px;
        }

        .container {
            background: linear-gradient(145deg, #0e1a2b, #060d1a);
            padding: 50px 40px;
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(0, 180, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 150, 255, 0.12);
            transition: all 0.3s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            justify-content: center;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #00a3ff, #0066cc);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 20px rgba(0, 150, 255, 0.3);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, #7ec8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 300;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 18px;
        }

        .input-group {
            margin-bottom: 28px;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(0, 20, 40, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(0, 150, 255, 0.15);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .input-wrapper:focus-within {
            border-color: #0088ff;
            box-shadow: 0 0 0 4px rgba(0, 136, 255, 0.15), 0 0 30px rgba(0, 136, 255, 0.05);
        }

        .input-wrapper input {
            width: 100%;
            padding: 18px 20px;
            background: transparent;
            border: none;
            outline: none;
            color: #e8f4ff;
            font-size: 18px;
            letter-spacing: 2px;
            font-weight: 400;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
            font-size: 15px;
        }

        .input-wrapper .icon {
            padding: 0 16px 0 20px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 20px;
        }

        .code-hint {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            letter-spacing: 0.5px;
            padding-right: 4px;
        }

        .btn-activate {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #0088ff, #0055cc);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 30px rgba(0, 100, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        .btn-activate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(0, 100, 255, 0.4);
            background: linear-gradient(135deg, #1a94ff, #0066dd);
        }

        .btn-activate:active {
            transform: translateY(0px);
            box-shadow: 0 4px 20px rgba(0, 100, 255, 0.2);
        }

        .btn-activate::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.05), transparent 70%);
            pointer-events: none;
        }

        .btn-activate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 15px rgba(0, 100, 255, 0.08);
        }

        .status-message {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            transition: all 0.3s ease;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 20, 40, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.3px;
        }

        .status-message.success {
            background: rgba(0, 200, 100, 0.08);
            border-color: rgba(0, 200, 100, 0.2);
            color: #5dffb0;
        }

        .status-message.error {
            background: rgba(255, 50, 50, 0.08);
            border-color: rgba(255, 50, 50, 0.15);
            color: #ff6b6b;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 28px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 0.5px;
        }

        .footer-links span {
            cursor: default;
        }

        /* Анимация для успешного состояния */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(0, 200, 100, 0.2); }
            100% { box-shadow: 0 0 0 20px rgba(0, 200, 100, 0); }
        }

        .status-message.success {
            animation: pulse-glow 1.5s ease-out;
        }

        /* Стили для темного скролла */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #060d1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a2a40;
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }
            .logo-text {
                font-size: 22px;
            }
            .input-wrapper input {
                font-size: 16px;
                padding: 16px 16px;
            }
            .btn-activate {
                font-size: 16px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <div class="logo-icon">◉</div>
        <span class="logo-text">VOICEMOD</span>
    </div>
    <div class="subtitle">Активация лицензии</div>

    <div class="input-group">
        <label for="codeInput">Введите код активации</label>
        <div class="input-wrapper">
            <span class="icon">◆</span>
            <input 
                type="text" 
                id="codeInput" 
                placeholder="____-____-____-____" 
                maxlength="23"
                autocomplete="off"
                spellcheck="false"
            >
        </div>
        <div class="code-hint">Формат: XXXX-XXXX-XXXX-XXXX</div>
    </div>

    <button class="btn-activate" id="activateBtn">Активировать</button>

    <div class="status-message" id="statusMessage">Ожидание ввода кода</div>

    <div class="footer-links">
        <span>●</span>
        <span>Поддержка</span>
        <span>●</span>
        <span>Лицензия</span>
        <span>●</span>
    </div>
</div>

<script>
    (function() {
        const codeInput = document.getElementById('codeInput');
        const activateBtn = document.getElementById('activateBtn');
        const statusMessage = document.getElementById('statusMessage');

        // Ожидаемый код
        const VALID_CODE = '2192-2195-9883-AP12';

        // Функция для форматирования кода при вводе (автоматическое добавление дефисов)
        function formatCode(input) {
            // Удаляем все не буквы/цифры
            let raw = input.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            let formatted = '';
            for (let i = 0; i < raw.length; i++) {
                if (i > 0 && i % 4 === 0) {
                    formatted += '-';
                }
                formatted += raw[i];
            }
            return formatted;
        }

        // Обработчик ввода с форматированием
        codeInput.addEventListener('input', function(e) {
            const cursorPos = this.selectionStart;
            const oldLength = this.value.length;

            // Форматируем
            let formatted = formatCode(this.value);
            this.value = formatted;

            // Корректируем позицию курсора
            const newLength = formatted.length;
            let newCursorPos = cursorPos;
            // Если мы вставляли дефис, сдвигаем курсор
            if (newLength > oldLength) {
                // Проверяем, был ли вставлен дефис
                const diff = newLength - oldLength;
                if (diff === 1) {
                    // Если после вставки дефиса курсор должен быть после него
                    const parts = formatted.split('-');
                    let charCount = 0;
                    for (let i = 0; i < parts.length; i++) {
                        charCount += parts[i].length;
                        if (i < parts.length - 1) {
                            charCount += 1; // дефис
                        }
                        if (charCount >= cursorPos + diff) {
                            newCursorPos = charCount;
                            break;
                        }
                    }
                }
            } else if (newLength < oldLength) {
                // При удалении сдвигаем курсор на место удаления
                newCursorPos = cursorPos;
            }
            // Ограничиваем
            newCursorPos = Math.min(newCursorPos, formatted.length);
            this.setSelectionRange(newCursorPos, newCursorPos);

            // Сбрасываем статус при изменении
            if (statusMessage.classList.contains('success') || statusMessage.classList.contains('error')) {
                statusMessage.className = 'status-message';
                statusMessage.textContent = 'Введите код для активации';
            }
        });

        // Запрещаем ввод более 23 символов (19 букв/цифр + 4 дефиса)
        codeInput.addEventListener('keydown', function(e) {
            if (this.value.length >= 23 && !['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(e.key)) {
                e.preventDefault();
            }
        });

        // Вставка из буфера обмена с форматированием
        codeInput.addEventListener('paste', function(e) {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData).getData('text');
            const cleaned = pasted.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            const truncated = cleaned.slice(0, 19);
            let formatted = '';
            for (let i = 0; i < truncated.length; i++) {
                if (i > 0 && i % 4 === 0) {
                    formatted += '-';
                }
                formatted += truncated[i];
            }
            this.value = formatted;
            // Триггерим событие для обновления статуса
            this.dispatchEvent(new Event('input'));
        });

        // Функция активации
        function activate() {
            const enteredCode = codeInput.value.trim();
            const normalizedEntered = enteredCode.toUpperCase();

            // Блокируем кнопку на время проверки
            activateBtn.disabled = true;
            activateBtn.textContent = 'Проверка...';

            // Небольшая задержка для имитации проверки
            setTimeout(() => {
                // Сравниваем с валидным кодом (регистронезависимо)
                if (normalizedEntered === VALID_CODE) {
                    // Успех!
                    statusMessage.className = 'status-message success';
                    statusMessage.textContent = '✅ Код верен! Перенаправление...';

                    // Перенаправление через 1 секунду
                    setTimeout(() => {
                        window.location.href = 'https://www.voicemod.net/';
                    }, 1000);

                } else {
                    // Ошибка
                    statusMessage.className = 'status-message error';
                    statusMessage.textContent = '❌ Неверный код. Попробуйте ещё раз.';

                    // Возвращаем кнопку в активное состояние
                    activateBtn.disabled = false;
                    activateBtn.textContent = 'Активировать';

                    // Очищаем поле через 2 секунды? (по желанию)
                    // codeInput.value = '';
                    // codeInput.focus();
                }
            }, 400);
        }

        // Обработчик клика по кнопке
        activateBtn.addEventListener('click', function(e) {
            e.preventDefault();

            const enteredCode = codeInput.value.trim();
            if (!enteredCode) {
                statusMessage.className = 'status-message error';
                statusMessage.textContent = '⚠️ Пожалуйста, введите код активации';
                codeInput.focus();
                return;
            }

            // Проверяем формат (должен быть XXXX-XXXX-XXXX-XXXX)
            const codePattern = /^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/;
            if (!codePattern.test(enteredCode.toUpperCase())) {
                statusMessage.className = 'status-message error';
                statusMessage.textContent = '⚠️ Неверный формат. Используйте XXXX-XXXX-XXXX-XXXX';
                return;
            }

            activate();
        });

        // Обработчик нажатия Enter в поле ввода
        codeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                activateBtn.click();
            }
        });

        // При загрузке фокус на поле ввода
        window.addEventListener('load', function() {
            codeInput.focus();
        });

        // Небольшая анимация для поля ввода при фокусе
        codeInput.addEventListener('focus', function() {
            this.parentElement.style.borderColor = '#0088ff';
            this.parentElement.style.boxShadow = '0 0 0 4px rgba(0,136,255,0.1), 0 0 30px rgba(0,136,255,0.03)';
        });

        codeInput.addEventListener('blur', function() {
            this.parentElement.style.borderColor = 'rgba(0,150,255,0.15)';
            this.parentElement.style.boxShadow = 'none';
        });

    })();
</script>
</body>
</html>
